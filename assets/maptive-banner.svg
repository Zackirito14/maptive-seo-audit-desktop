<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071526"/>
      <stop offset="50%" stop-color="#0C2343"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#7CC7FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1430" cy="60" r="230" fill="#3B82F6" opacity="0.13" filter="url(#glow)"/>
  <circle cx="1110" cy="470" r="220" fill="#8B5CF6" opacity="0.10" filter="url(#glow)"/>

  <rect x="56" y="56" width="10" height="132" rx="5" fill="url(#accent)"/>
  <text x="94" y="116" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#7DD3FC">MAPTIVE</text>
